  .masthead{background:#fff;color:var(--ink);padding:14px 28px;border-bottom:3px solid var(--brand);display:flex;align-items:center;gap:14px;}
  .masthead img{height:52px;width:52px;object-fit:contain;flex:0 0 auto;}
  .masthead .titles h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 2px;color:var(--brand-dark);}
  .masthead .titles .sub{font-size:12px;color:var(--ink-soft);}
  .masthead.con-banda{border-bottom:none;}
  .banda-act{background:#F8EBD3;color:#5A3210;border-top:1px solid #E7CFA5;border-bottom:2px solid #D9A441;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 24px;flex-wrap:wrap;text-align:center;}
  .banda-act[hidden]{display:none;}
  .banda-act .reloj{width:24px;height:24px;border:2px solid #B5651D;border-radius:50%;position:relative;flex:0 0 auto;}
  .banda-act .reloj:before,.banda-act .reloj:after{content:"";position:absolute;left:50%;top:50%;background:#B5651D;transform-origin:50% 100%;border-radius:2px;}
  .banda-act .reloj:before{width:2px;height:7px;margin:-7px 0 0 -1px;}
  .banda-act .reloj:after{width:2px;height:5px;margin:-5px 0 0 -1px;transform:rotate(-120deg);}
  .banda-act .lin{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center;}
  .banda-act .et{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A5A2B;}
  .banda-act .f{font-family:var(--serif);font-size:17px;font-weight:600;color:#5A3210;}
  .banda-act .f small{font-family:var(--mono);font-size:13px;margin-left:6px;font-weight:600;color:#B5651D;}
  @media(max-width:720px){.banda-act{padding:8px 16px;gap:8px;} .banda-act .f{font-size:16px;}}

  .wrap{max-width:1040px;margin:0 auto;padding:22px 24px 60px;}

  .search-panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:20px;}
  .search-panel h2{font-family:var(--serif);font-size:15px;margin:0 0 14px;color:var(--brand-dark);}
  .search-panel .corte{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-8px 0 12px;}
  .field{position:relative;}
  .field + .field{margin-top:16px;}
  .field label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:#FBFCFB;font-family:var(--sans);}
  .field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .hint{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  button{font-family:var(--sans);font-size:13px;font-weight:600;border:none;border-radius:3px;padding:9px 16px;cursor:pointer;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
  .btn-secundario{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12px;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:500;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}

  .suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-top:none;max-height:260px;overflow:auto;z-index:20;box-shadow:0 6px 14px rgba(0,0,0,.08);display:none;}
  .suggestions.show{display:block;}
  .suggestions > div{padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #F0F1EF;}
  .suggestions > div:hover{background:#F1F6F4;}
  .s-id{font-family:var(--mono);color:var(--brand-dark);font-weight:600;display:block;font-size:11px;margin-bottom:2px;}
  .s-nom{display:block;color:var(--ink);}
  .s-extra{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .result-header{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;padding:16px 20px;margin-bottom:18px;}
  .result-header .cui-tag{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .result-header h2{font-family:var(--serif);font-size:19px;margin:4px 0 10px;color:var(--ink);}
  .result-header .modalidad{font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .enlaces-externos{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 8px;}
  .link-externo{color:var(--brand-dark);font-weight:600;text-decoration:none;font-size:12.5px;white-space:nowrap;}
  .link-externo:hover{text-decoration:underline;}
  .result-header .nombre-proy{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .tag-modalidad{font-size:9.5px;padding:2px 8px;border-radius:2px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em;font-weight:700;border:1px solid rgba(0,0,0,.06);}
  .componente-obra{display:inline-block;background:#EEF3F8;color:#2C5A8C;font-size:10.5px;padding:1px 7px;border-radius:3px;font-weight:600;}
  .componente-titulo{margin:-4px 0 8px;font-size:14px;font-weight:700;color:#2C5A8C;}
  .act-operativa{display:inline-block;background:#EAF2E9;color:#3B6B45;font-size:10.5px;padding:1px 7px;border-radius:3px;font-weight:600;}
  .tag-saldo{font-size:9.5px;padding:2px 8px;border-radius:2px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .tag-saldo.s0{background:#F2F1EC;color:#6B6154;} .tag-saldo.s1{background:#E7F0E9;color:#2F6B45;} .tag-saldo.s2{background:#FDEAE3;color:#A0483A;}
  .volver{background:none;border:none;color:var(--brand-dark);font-size:12px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline;font-family:var(--sans);font-weight:500;}

  .meta-opcion{display:block;width:100%;text-align:left;background:#FBFCFB;border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);font-weight:400;}
  .meta-opcion:hover{background:#FBF3E8;border-color:var(--brand);}
  .meta-opcion .mo-linea1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;}
  .meta-opcion .mo-num{font-family:var(--mono);font-weight:700;color:var(--brand-dark);}
  .meta-opcion .mo-linea2{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-family:var(--mono);}

  .proyecto-info{background:#F7F5F0;padding:8px 16px;font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:3px;margin-bottom:14px;line-height:1.6;}
  .proyecto-info b{color:var(--brand-dark);font-weight:600;}
  .proyecto-info .info-grupo-funcional{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}

  .meta-block{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden;}
  .meta-block-header{background:#FBF3E8;color:var(--brand-dark);padding:9px 16px;font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
  .meta-block-header b{font-family:var(--serif);font-size:13.5px;font-weight:600;}
  .grupo{padding:12px 16px;border-top:1px solid var(--line);}
  .grupo:first-of-type{border-top:none;}
  .grupo .fr{font-size:12.5px;font-weight:600;color:var(--brand-dark);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .grupo .fr .rubro{color:var(--ink-soft);font-weight:400;}
  .btn-proponer-mod{background:#EEF3F8;border:1px solid #C7D6E8;color:#2C5A8C;font-size:11px;font-weight:600;padding:4px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:3px;}
  table{width:100%;min-width:640px;border-collapse:collapse;font-size:12px;}
  .scroll-hint{display:none;font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-align:right;margin:4px 2px 6px;letter-spacing:.04em;}
  @media(max-width:720px){.scroll-hint{display:block;} .masthead{padding:12px 16px;} .wrap{padding:16px 12px 50px;}}
  thead th{text-align:right;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 8px;border-bottom:1.5px solid var(--brand);}
  thead th:first-child{text-align:left;}
  td{padding:6px 8px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;border-bottom:1px solid #EEF0EE;white-space:nowrap;}
  td:first-child{text-align:left;font-family:var(--sans);white-space:normal;}
  td.saldo-pos{color:var(--red);}
  tr.tot td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:none;}
  .subtotal-meta{display:flex;justify-content:space-between;background:#FAF8F4;color:var(--ink-soft);padding:6px 16px;font-family:var(--mono);font-size:10.5px;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);}
  .subtotal-meta b{font-weight:600;color:var(--ink);}

  .panel-propuesta{margin-top:10px;padding:12px;background:#FBF9F5;border:1px dashed var(--line);border-radius:6px;}
  .panel-propuesta-titulo{font-size:12.5px;font-weight:700;color:var(--brand-dark);margin-bottom:4px;}
  .panel-propuesta .table-scroll{border:none;}
  .tabla-propuesta{width:100%;border-collapse:collapse;font-size:11.5px;min-width:700px;}
  .tabla-propuesta th{text-align:left;background:#F2F1EC;padding:5px 7px;border:1px solid var(--line);font-family:var(--sans);font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink);}
  .tabla-propuesta td{padding:4px 6px;border:1px solid var(--line);vertical-align:middle;text-align:left;font-family:var(--sans);white-space:normal;}
  .tabla-propuesta td.num{text-align:right;font-family:var(--mono);white-space:nowrap;}
  .fila-total-propuesta td{font-weight:700;background:#F2F1EC;border-top:2px solid var(--line);}
  .fila-total-propuesta td.total-cuadra{background:#E7F0E9;color:#2F6B45;}
  .fila-total-propuesta td.total-no-cuadra{background:#FDEAE3;color:#A0483A;}
  .na{color:var(--ink-soft);font-style:italic;font-size:11px;}
  .etiqueta-nuevo{font-size:9.5px;background:#F3E7D0;color:#8A5A16;padding:1px 6px;border-radius:8px;font-weight:600;font-style:normal;}
  tr.fila-nueva-clasificador td{background:#FDF8ED;}
  .btn-quitar-fila-clas{background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;padding:0 4px;font-weight:700;}
  .agregar-clasificador{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .agregar-clasificador select{flex:1;min-width:240px;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#FBFCFD;}
  .btn-agregar-clas{background:#fff;border:1px solid var(--accent);color:var(--accent);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .btn-agregar-clas:hover{background:var(--accent-bg);}
  .btn-agregar-clas:disabled{opacity:.5;cursor:not-allowed;}
  .tabla-propuesta input[type=number]{width:92px;padding:3px 5px;font-size:11.5px;border:1px solid var(--line);border-radius:3px;-moz-appearance:textfield;}
  .tabla-propuesta input[type=number]::-webkit-outer-spin-button,
  .tabla-propuesta input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  #tooltipFlotante{position:fixed;background:#2A231C;color:#fff;font-size:11px;line-height:1.35;padding:6px 9px;border-radius:6px;max-width:220px;white-space:normal;box-shadow:0 3px 10px rgba(0,0,0,.22);z-index:1000;opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .12s, transform .12s;pointer-events:none;}
  #tooltipFlotante::after{content:"";position:absolute;top:100%;left:14px;border:5px solid transparent;border-top-color:#2A231C;}
  #tooltipFlotante.show{opacity:1;visibility:visible;transform:translateY(0);}
  #tooltipFlotante.tipo-saldo{background:#A0483A;}
  #tooltipFlotante.tipo-saldo::after{border-top-color:#A0483A;}
  .tabla-propuesta input.input-advertencia{border-color:#C0392B;background:#FDEAE3;}
  .resumen-propuesta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:8px 0;}
  .resumen-propuesta .ok{color:#2F6B45;font-weight:700;}
  .resumen-propuesta .error{color:#C0392B;font-weight:700;}

  .tabla-final-contenedor{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .tabla-final-titulo{font-size:12.5px;font-weight:700;color:var(--brand-dark);margin-bottom:4px;}
  .tabla-final-ayuda{font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .tabla-final{border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:11pt;background:#fff;color:#000;min-width:0;width:auto;}
  .tabla-final td,.tabla-final th{border:1px solid #000;padding:4px 7px;vertical-align:middle;white-space:normal;font-family:Arial,Helvetica,sans-serif;font-variant-numeric:normal;text-transform:none;letter-spacing:0;font-size:11pt;color:#000;}
  .tabla-final th{text-align:center;font-weight:700;background:#fff;}
  .tabla-final td{text-align:left;}
  .tabla-final td.n{text-align:right;white-space:nowrap;}
  .tabla-final td.c{text-align:center;}
  .tabla-final td[contenteditable]{outline:none;}
  .tabla-final td[contenteditable]:focus{background:#FFF8E1;}
  .tabla-final tr.enc td{font-weight:700;text-align:center;}
  .tabla-final tr.total td{font-weight:700;}
  .btn-copiar-tabla{background:var(--brand);color:#fff;border:none;font-size:12px;padding:7px 14px;border-radius:4px;cursor:pointer;}

  .empty{padding:50px 20px;text-align:center;color:var(--ink-soft);font-family:var(--serif);font-size:16px;}

  /* ===== Impresión: todo el resultado en una sola hoja A4 (se ajusta el tamaño solo) ===== */
  @page{ size:A4 portrait; margin:8mm; }
  @media print{
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
  html.preimp body{ background:#fff !important; }
  html.preimp .search-panel, html.preimp .suggestions, html.preimp #tooltipFlotante, html.preimp .scroll-hint,
  html.preimp .btn-proponer-mod, html.preimp .actions, html.preimp .btn-primary, html.preimp .btn-secundario,
  html.preimp .btn-agregar-clas, html.preimp .btn-quitar-fila-clas, html.preimp .agregar-clasificador{ display:none !important; }
  html.preimp .wrap{ max-width:none; padding:10px 14px 0; }
  html.preimp .masthead{ padding:10px 14px; }
  html.preimp .table-scroll{ overflow:visible; }
  html.preimp .meta-block, html.preimp .proyecto-info{ box-shadow:none; }
</style>
</head>

// ===== Utilidades =====
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
const money = n => 'S/ ' + Number(n).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
const entero = n => Math.round(Number(n)).toLocaleString('es-PE');
const dec2 = n => Number(n).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
function xmlEscHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sinAcentos(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

const MODALIDAD_COLORES = {
  'Administración Directa': {bg:'#E7F0E9', fg:'#2F6B45'},
  'Contrata': {bg:'#E5EDF7', fg:'#2C5A8C'},
  'Obras por Impuestos - OxI': {bg:'#F3E7D0', fg:'#8A5A16'},
  'Transferencias Financieras': {bg:'#F0E5F2', fg:'#7A3E8C'},
  'Actividades de mantenimiento': {bg:'#FDEAE3', fg:'#A0483A'},
  'Transferencias físicas': {bg:'#E3F1F1', fg:'#1F6E6E'},
  'Evaluaciones': {bg:'#EEEAF7', fg:'#5B4A8A'},
};
function modalidadStyle(m){
  if(!m) return {bg:'#F2F1EC', fg:'#6B6154'};
  if(MODALIDAD_COLORES[m]) return MODALIDAD_COLORES[m];
  if(m.startsWith('Mixta')) return {bg:'#FBF0DA', fg:'#8A5A16'};
  return {bg:'#F2F1EC', fg:'#6B6154'};
}
function modalidadBadge(m){
  if(!m) return '<span class="tag-modalidad" style="background:#F2F1EC;color:#6B6154;">no disponible</span>';
  const s = modalidadStyle(m);
  return `<span class="tag-modalidad" style="background:${s.bg};color:${s.fg};">${xmlEscHtml(m)}</span>`;
}

// ===== Índice de metas (cada meta es una unidad de búsqueda) =====
const METAS = [];
const METAS_POR_SF = {};
const METAS_POR_CUI = {};
DATA.projects.forEach(p => (p.secfuncs||[]).forEach(sf => {
  const m = { p, sf, secFunc: String(sf.sec_func), cui: String(p.cui), esActividad: !!p.es_actividad };
  METAS.push(m);
  METAS_POR_SF[m.secFunc] = m;
  (METAS_POR_CUI[m.cui] = METAS_POR_CUI[m.cui] || []).push(m);
}));
METAS.sort((a,b)=> a.cui.localeCompare(b.cui) || (+a.secFunc) - (+b.secFunc));

function etiquetaId(m){ return m.esActividad ? 'META-' + m.secFunc : 'CUI ' + m.cui; }

function lineaSugerencia(m){
  const partes = ['Meta ' + m.secFunc];
  if(m.sf.componente_obra) partes.push('Comp.: ' + m.sf.componente_obra);
  if(m.sf.modalidad) partes.push(m.sf.modalidad);
  return `<div data-sf="${m.secFunc}">
    <span class="s-id">${etiquetaId(m)} · ${partes.map(xmlEscHtml).join(' · ')}</span>
    <span class="s-nom">${xmlEscHtml(m.esActividad ? (m.sf.actividad_accion_obra_nom||'') + ' - ' + (m.sf.meta_nombre||'') : m.p.nombre)}</span>
    ${m.sf.actividad_operativa ? `<span class="s-extra">AO: ${xmlEscHtml(m.sf.actividad_operativa.replace(/\n+/g,' | '))}</span>` : ''}
  </div>`;
}

function hideSugs(){ document.querySelectorAll('.suggestions').forEach(s=>{ s.classList.remove('show'); s.innerHTML=''; }); }

function mostrarSugerenciasNum(v, inputEl){
  const box = document.getElementById('sugNum');
  box.classList.remove('show'); box.innerHTML='';
  if(v.length < 2) return;
  let matches = METAS.filter(m => m.secFunc === v || m.cui.startsWith(v));
  matches.sort((a,b)=> (a.secFunc===v?0:1) - (b.secFunc===v?0:1));
  matches = matches.slice(0,12);
  if(!matches.length){ box.innerHTML = '<div style="cursor:default;color:var(--ink-soft);">Sin coincidencias</div>'; box.classList.add('show'); return; }
  box.innerHTML = matches.map(lineaSugerencia).join('');
  box.classList.add('show');
  box.querySelectorAll('div[data-sf]').forEach(d=>d.addEventListener('click', ()=>{ showMeta(d.dataset.sf); hideSugs(); if(inputEl) inputEl.value=''; }));
}
function onNumInput(e){
  const v = e.target.value.replace(/[^0-9]/g,'');
  if(v !== e.target.value) e.target.value = v;
  mostrarSugerenciasNum(v, e.target);
}
function onNumEnter(v, inputEl){
  v = v.replace(/[^0-9]/g,'');
  if(!v) return;
  if(METAS_POR_SF[v]){ showMeta(v); hideSugs(); if(inputEl) inputEl.value=''; return; }
  const delCui = METAS_POR_CUI[v]||[];
  if(delCui.length === 1){ showMeta(delCui[0].secFunc); hideSugs(); if(inputEl) inputEl.value=''; return; }
  if(delCui.length > 1){ mostrarSugerenciasNum(v, inputEl); return; }
  hideSugs();
  showEmptyMsg('No se encontró ninguna meta con CUI o SEC_FUNC "' + xmlEscHtml(v) + '".');
}

// ===== Búsqueda de texto tolerante =====
// Ignora tildes, mayúsculas, puntos y signos ("IE" = "I.E."), busca por palabras en cualquier
// orden, entiende abreviaturas comunes en ambos sentidos y tolera errores de escritura.
const BT_ALIAS = {
  ie: [['institucion', 'educativa']], iiee: [['instituciones', 'educativas']],
  cs: [['centro', 'salud'], ['establecimiento', 'salud']], ps: [['puesto', 'salud']],
  cp: [['centro', 'poblado']], ccpp: [['centros', 'poblados']],
  av: [['avenida']], jr: [['jiron']],
};
const BT_VACIAS = new Set(['de', 'del', 'la', 'las', 'el', 'los', 'y', 'e', 'en', 'a', 'al', 'con', 'por', 'para']);
const BT_CACHE = new Map();

function btNormalizar(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/\./g, '')                 // "i.e." -> "ie", "c.s." -> "cs"
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function btIndice(texto){
  const k = String(texto || '');
  let r = BT_CACHE.get(k);
  if(r) return r;
  const pal = btNormalizar(k).split(' ').filter(Boolean);
  const set = new Set(pal);
  const frase = ' ' + pal.join(' ') + ' ';
  Object.entries(BT_ALIAS).forEach(([abr, formas]) => {
    formas.forEach(exp => {
      if(set.has(abr)) exp.forEach(x => set.add(x));
      const conDe = exp.length === 2 ? ' ' + exp[0] + ' de ' + exp[1] + ' ' : null;
      if(frase.includes(' ' + exp.join(' ') + ' ') || (conDe && frase.includes(conDe))) set.add(abr);
    });
  });
  r = Array.from(set);
  if(BT_CACHE.size > 8000) BT_CACHE.clear();
  BT_CACHE.set(k, r);
  return r;
}
// Distancia de edición con transposiciones (dos letras invertidas cuentan como un solo error).
function btDistancia(a, b, max){
  if(Math.abs(a.length - b.length) > max) return max + 1;
  let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i]; let minFila = i;
    for(let j = 1; j <= b.length; j++){
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if(i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
      cur[j] = v; if(v < minFila) minFila = v;
    }
    if(minFila > max) return max + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}
function btPuntajeToken(t, palabras){
  const numero = /^\d+$/.test(t);
  let mejor = 0;
  for(const w of palabras){
    if(w === t) return 4;
    if(w.startsWith(t)){ mejor = Math.max(mejor, 3); continue; }
    if(numero){ if(w.includes(t)) mejor = Math.max(mejor, 2); continue; }
    if(t.length >= 4){
      const k = t.length >= 8 ? 2 : 1;
      const d = Math.min(btDistancia(t, w, k), w.length > t.length ? btDistancia(t, w.slice(0, t.length), k) : k + 1);
      if(d <= k) mejor = Math.max(mejor, d === 1 ? 2 : 1.5);
    }
  }
  return mejor;
}
// Puntaje de una consulta frente a uno o más textos: 0 si alguna palabra no aparece.
function btPuntaje(consulta, ...textos){
  let tokens = btNormalizar(consulta).split(' ').filter(Boolean);
  const utiles = tokens.filter(t => !BT_VACIAS.has(t));
  if(utiles.length) tokens = utiles;
  if(!tokens.length) return 0;
  const palabras = textos.flatMap(t => btIndice(t));
  let total = 0;
  for(const t of tokens){ const p = btPuntajeToken(t, palabras); if(!p) return 0; total += p; }
  return total;
}
function btLargoConsulta(consulta){ return btNormalizar(consulta).replace(/ /g, '').length; }

function onTextoInput(e){
  const v = e.target.value.trim();

    const m = w.match(/^([("“'¿¡]*)(.*?)([)."”'\?!,;:]*)$/);
    const pre = m ? m[1] : '', core = m ? m[2] : w, post = m ? m[3] : '';
    const coreConPunto = core + (post.startsWith('.') ? '.' : '');
    if(ABREV[coreConPunto] !== undefined) return pre + ABREV[coreConPunto] + post.replace(/^\./,'');
    if(ABREV[core] !== undefined) return pre + ABREV[core] + post;
    if(/^[A-ZÁÉÍÓÚÑ]{1,8}$/.test(core) && ACRONIMOS.has(core)) return pre + core + post;
    if(/^([A-Z]\.)+[A-Z]?\.?$/.test(core)) return pre + core + post;
    if(/\d/.test(core)) return pre + core + post;
    if(/^[A-Z]+-[A-Z0-9]+$/.test(core) && core.length <= 8) return pre + core + post;
    let low = core.toLowerCase();
    if(ACENTOS[low]) low = ACENTOS[low];
    return pre + low + post;
  });
  let t = salida.join(' ');
  PROPIOS_ORDENADOS.forEach(({n, re}) => { t = t.replace(re, (all, antes) => antes + n); });
  t = t.replace(/(^|[.:¿¡"“(]\s*)([a-záéíóúüñ])/g, (all, antes, ch) => antes + ch.toUpperCase());
  t = t.replace(/(^|[^a-záéíóúüñ])(san|santa|santo)\s+([a-záéíóúüñA-ZÁÉÍÓÚÑ])/g, (all, antes, s, ch) => antes + s.charAt(0).toUpperCase() + s.slice(1) + ' ' + ch.toUpperCase());
  return t;
}
function nombreFuente(g){ return NOMBRES_FIJOS.fuente[String(g.fuente_cod)] || formatoOracion(g.fuente_nom); }
function nombreRubro(g){ return NOMBRES_FIJOS.rubro[String(g.rubro_cod)] || formatoOracion(g.rubro_nom); }

// ===== Propuesta de modificación presupuestaria (anulación / crédito dentro del mismo rubro) =====

// Prefijo de "familia" de un clasificador: todo el código menos el último segmento.
// Ej. "2.6.8.1.4.3" -> "2.6.8.1.4" (así, .1/.2/.3 dentro de esa familia son "hermanos").
function familiaClasificador(cod){
  const partes = String(cod).split('.');
  return partes.slice(0, -1).join('.');
}

// Para proyectos de inversión solo se ejecuta contra la genérica 6 (Adquisición de Activos
// No Financieros); para actividades, contra la genérica 3 (Bienes y Servicios).
function genericaEsperada(p){ return p.es_actividad ? '3' : '6'; }

// Para proyectos, el universo de clasificadores de la genérica 6 se acota a los que
// realmente se usan en metas de supervisión/liquidación (acción 6000002) o en obras
// (acción que empieza con 4) cuya meta es "Gestión de proyectos" — así el desplegable
// no muestra clasificadores de construcción/administración directa que no aplican aquí.
let _clasificadoresGenerica6HabilitadosCache = null;
function clasificadoresGenerica6Habilitados(){
  if(_clasificadoresGenerica6HabilitadosCache) return _clasificadoresGenerica6HabilitadosCache;
  const habilitados = new Set();
  DATA.projects.forEach(p => p.secfuncs.forEach(sf => {
    const accion = sf.actividad_accion_obra_cod || '';
    const esObraDeGestionProyectos = accion.startsWith('4') && (sf.meta_nombre||'').trim().toUpperCase() === 'GESTION DE PROYECTOS';
    if(accion === '6000002' || esObraDeGestionProyectos){
      sf.grupos.forEach(g => g.lineas.forEach(l => { if(l.generica === '6') habilitados.add(l.clas_cod); }));
    }
  }));
  _clasificadoresGenerica6HabilitadosCache = habilitados;
  return habilitados;
}

function opcionesClasificadorParaAgregar(p, g){
  const yaPresentes = new Set(g.lineas.map(l => l.clas_cod));
  const generica = genericaEsperada(p);
  const familias = new Set(g.lineas.map(l => familiaClasificador(l.clas_cod)));
  const habilitadosProyecto = !p.es_actividad ? clasificadoresGenerica6Habilitados() : null;
  const candidatos = DATA.clasificadores.filter(c => c.generica === generica);
  const sugeridos = [], otros = [];
  candidatos.forEach(c => {
    const cod = [c.tipo_transaccion, c.generica, c.subgenerica, c.subgenerica_det, c.especifica, c.especifica_det].join('.');
    if(yaPresentes.has(cod)) return;
    if(habilitadosProyecto && !habilitadosProyecto.has(cod)) return;
    const item = { cod, nom: c.especifica_det_nom || c.especifica_nom, familia: familiaClasificador(cod) };
    (familias.has(item.familia) ? sugeridos : otros).push(item);
  });
  sugeridos.sort((a,b) => a.cod.localeCompare(b.cod));
  otros.sort((a,b) => a.cod.localeCompare(b.cod));
  return { sugeridos, otros, generica };
}

function renderSelectAgregar(gid){
  const sel = document.getElementById('selAgregarClas_' + gid);
  if(!sel) return;
  const { m } = REGISTRO_GRUPOS[gid];

  const opt = c => `<option value="${xmlEscHtml(c.cod)}">${xmlEscHtml(c.cod)} — ${xmlEscHtml(c.nom)}</option>`;
  sel.innerHTML =
    (sugeridos.length ? `<optgroup label="Sugeridos (misma familia)">${sugeridos.map(opt).join('')}</optgroup>` : '') +
    (otros.length ? `<optgroup label="Otros clasificadores (genérica ${generica})">${otros.map(opt).join('')}</optgroup>` : '');
  const btn = document.getElementById('btnAgregarClas_' + gid);
  if(btn) btn.disabled = !sugeridos.length && !otros.length;
}

// Compara codigos de clasificador segmento a segmento como numeros (2.6.8.1.4.2 antes que
// 2.6.8.1.4.10), no como texto — un orden alfabetico simple falla apenas un segmento llega a 2 digitos.
function compararClasCod(a, b){
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  const n = Math.max(pa.length, pb.length);
  for(let i = 0; i < n; i++){
    const d = (pa[i]||0) - (pb[i]||0);
    if(d) return d;
  }
  return 0;
}

      <td class="num">${entero(l.pim)}</td>

  const { g } = REGISTRO_GRUPOS[gid];
  const partes = cod.split('.');
  const nuevaLinea = {
    clas_cod: cod, clas_nom: nom, pim: 0, cert: 0, saldo_cert: 0, comp: 0, saldo_comp: 0, dev: 0,
    generica: partes[0], subgenerica: partes[1], subgenerica_det: partes[2], especifica: partes[3], especifica_det: partes[4],
  };
  const idx = g.lineas.length;
  g.lineas.push(nuevaLinea);
  const tbody = document.getElementById('filas_' + gid);
  const filaSiguiente = Array.from(tbody.querySelectorAll('tr')).find(tr => compararClasCod(tr.dataset.cod, cod) > 0);

}

function quitarClasificadorDeLaPropuesta(gid, fila){

  actualizarValidacionPropuesta(gid);

function leerFilasPropuesta(gid){
  const { g } = REGISTRO_GRUPOS[gid];
  const out = [];
  document.querySelectorAll('#filas_' + gid + ' tr').forEach(tr => {
    const l = g.lineas[+tr.dataset.idx];
    const inputAnula = tr.querySelector('.inp-anula');
    const anula = inputAnula ? (parseInt(inputAnula.value, 10) || 0) : 0;
    const credito = parseInt(tr.querySelector('.inp-credito').value, 10) || 0;
    out.push({ tr, l, anula, credito, nuevo: Math.round(l.pim - anula + credito), nuevoSaldo: round2(l.saldo_cert - anula + credito) });
  });
  return out;
}

const AVISOS_TRANSITORIOS = new WeakMap();
let tooltipInputActivo = null;

function posicionarTooltip(inputEl){
  const tip = document.getElementById('tooltipFlotante');
  const r = inputEl.getBoundingClientRect();
  tip.style.left = Math.max(4, r.left) + 'px';
  tip.style.top = (r.top - tip.offsetHeight - 9) + 'px';
}
function mostrarAvisoTransitorio(inputEl, mensaje){
  const tip = document.getElementById('tooltipFlotante');
  tip.textContent = mensaje;
  tip.classList.remove('tipo-saldo');
  tooltipInputActivo = inputEl;
  tip.classList.add('show');
  posicionarTooltip(inputEl);
  const anterior = AVISOS_TRANSITORIOS.get(inputEl);
  if(anterior) clearTimeout(anterior);
  const t = setTimeout(()=>{
    AVISOS_TRANSITORIOS.delete(inputEl);
    actualizarAvisoSaldo(inputEl);
  }, 2200);
  AVISOS_TRANSITORIOS.set(inputEl, t);
}
function actualizarAvisoSaldo(inputEl){
  const pendiente = OCULTAMIENTOS_PENDIENTES.get(inputEl);
  if(pendiente){ clearTimeout(pendiente); OCULTAMIENTOS_PENDIENTES.delete(inputEl); }
  if(AVISOS_TRANSITORIOS.has(inputEl)) return; // hay un aviso de "solo enteros" activo, no lo pisamos
  const tip = document.getElementById('tooltipFlotante');
  if(inputEl.classList.contains('input-advertencia')){
    tip.textContent = 'Monto supera el saldo a certificar';
    tip.classList.add('tipo-saldo');
    tooltipInputActivo = inputEl;
    tip.classList.add('show');
    posicionarTooltip(inputEl);
  } else if(tooltipInputActivo === inputEl){
    tip.classList.remove('show', 'tipo-saldo');
    tooltipInputActivo = null;
  }
}
const OCULTAMIENTOS_PENDIENTES = new WeakMap();
function ocultarTooltipDe(inputEl){
  if(tooltipInputActivo !== inputEl) return;
  const anterior = OCULTAMIENTOS_PENDIENTES.get(inputEl);
  if(anterior) clearTimeout(anterior);
  const t = setTimeout(()=>{
    OCULTAMIENTOS_PENDIENTES.delete(inputEl);
    if(tooltipInputActivo !== inputEl) return;
    document.getElementById('tooltipFlotante').classList.remove('show', 'tipo-saldo');
    tooltipInputActivo = null;
  }, 1800);
  OCULTAMIENTOS_PENDIENTES.set(inputEl, t);
}

function actualizarValidacionPropuesta(gid){
  const filas = leerFilasPropuesta(gid);
  if(!filas.length) return;
  let totalPim=0, totalSaldo=0, totalAnula=0, totalCredito=0, totalNuevo=0, totalNuevoSaldo=0, hayExceso=false, hayNegativo=false;
  filas.forEach(f => {
    f.tr.querySelector('.pim-propuesto').textContent = entero(f.nuevo);
    f.tr.querySelector('.nuevo-saldo-propuesto').textContent = dec2(f.nuevoSaldo);
    const inputAnula = f.tr.querySelector('.inp-anula');
    if(inputAnula){
      const excede = f.anula > Math.floor(f.l.saldo_cert + 1e-9);
      inputAnula.classList.toggle('input-advertencia', excede);
      actualizarAvisoSaldo(inputAnula);
      if(excede) hayExceso = true;
    }
    if(f.nuevo < 0) hayNegativo = true;
    totalPim += f.l.pim; totalSaldo += f.l.saldo_cert; totalAnula += f.anula; totalCredito += f.credito; totalNuevo += f.nuevo; totalNuevoSaldo += f.nuevoSaldo;
  });
  const diff = totalAnula - totalCredito;
  const cuadra = diff === 0 && totalAnula > 0;
  const sinNada = totalAnula === 0 && totalCredito === 0;

  document.getElementById('totPim_'+gid).textContent = entero(totalPim);
  document.getElementById('totSaldo_'+gid).textContent = dec2(totalSaldo);
  document.getElementById('totNuevoSaldo_'+gid).textContent = dec2(totalNuevoSaldo);
  document.getElementById('totNuevo_'+gid).textContent = entero(totalNuevo);
  const celdaAnula = document.getElementById('totAnula_'+gid);
  const celdaCredito = document.getElementById('totCredito_'+gid);
  celdaAnula.textContent = entero(totalAnula);
  celdaCredito.textContent = entero(totalCredito);
  const clase = sinNada ? '' : (cuadra ? 'total-cuadra' : 'total-no-cuadra');
  celdaAnula.className = 'num ' + clase;
  celdaCredito.className = 'num ' + clase;

  const btn = document.querySelector(`.btn-generar-tabla[data-gid="${gid}"]`);
  if(btn) btn.disabled = !cuadra || hayNegativo;
}

function confirmarCopiado(gid){
  const btn = document.querySelector(`.btn-copiar-tabla[data-gid="${gid}"]`);

async function copiarTablaPropuesta(gid){
  const tabla = document.getElementById('tablaCopiar_' + gid);
  if(!tabla) return;
  const clon = tabla.cloneNode(true);
  clon.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
  clon.removeAttribute('id');
  clon.setAttribute('border','1');
  clon.setAttribute('cellpadding','4');
  clon.style.borderCollapse = 'collapse';
  clon.querySelectorAll('td,th').forEach(el => { el.style.border = '1px solid #000'; el.style.padding = '3px 6px'; el.style.fontFamily = 'Arial, Helvetica, sans-serif'; el.style.fontSize = '11pt'; });
  clon.querySelectorAll('td.n').forEach(el => el.style.textAlign = 'right');
  clon.querySelectorAll('td.c, th').forEach(el => el.style.textAlign = 'center');
  clon.querySelectorAll('tr.enc td, tr.total td, th').forEach(el => el.style.fontWeight = 'bold');
  const html = clon.outerHTML;
  const texto = tabla.innerText;
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([texto], {type:'text/plain'}) })]);
      confirmarCopiado(gid); return;
    }
  }catch(e){}
  try{
    const range = document.createRange(); range.selectNode(tabla);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy'); sel.removeAllRanges();
    confirmarCopiado(gid);
  }catch(e){ alert('No se pudo copiar automáticamente. Selecciona la tabla manualmente y usa Ctrl+C / Cmd+C.'); }
}

// ===== Banda de fecha y hora de actualización (columna FECHA_ACTUALIZACION_MEF de la base) =====
function mostrarBandaActualizacion(meta){
  const banda = document.getElementById('bandaAct'); if(!banda) return;
  const m = String(meta.fecha_consulta || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return;   // sin fecha: no se muestra la banda y la cabecera queda como antes
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const d = new Date(+m[3], +m[2]-1, +m[1]);
  let txt = xmlEscHtml(dias[d.getDay()] + ' ' + m[0]);
  const h = String(meta.hora_consulta || '').match(/^(\d{2}):(\d{2})$/);
  if(h){
    const hh = +h[1]; const h12 = hh % 12 === 0 ? 12 : hh % 12;
    txt += '<small>' + String(h12).padStart(2,'0') + ':' + h[2] + (hh < 12 ? ' a.\u00a0m.' : ' p.\u00a0m.') + '</small>';
  }
  document.getElementById('bandaActFecha').innerHTML = txt;
  banda.hidden = false;
  const mh = document.querySelector('.masthead'); if(mh) mh.classList.add('con-banda');
}

  mostrarBandaActualizacion(meta);

  const qNum = document.getElementById('qNum');
  qNum.addEventListener('input', onNumInput);
  qNum.addEventListener('keydown', e => { if(e.key==='Enter'){ onNumEnter(qNum.value.trim(), qNum); } });
  document.getElementById('qTexto').addEventListener('input', onTextoInput);
  document.addEventListener('click', e => { if(!e.target.closest('.field')) hideSugs(); });

  const ra = document.getElementById('resultArea');
  ra.addEventListener('click', e => {
    const b1 = e.target.closest('.btn-proponer-mod'); if(b1){ abrirFormularioPropuesta(b1.dataset.gid); return; }
    const b2 = e.target.closest('.btn-cerrar-propuesta'); if(b2){ document.getElementById('propuesta_' + b2.dataset.gid).innerHTML=''; return; }
    const b3 = e.target.closest('.btn-generar-tabla'); if(b3 && !b3.disabled){ generarTablaFinal(b3.dataset.gid); return; }
    const b4 = e.target.closest('.btn-copiar-tabla'); if(b4){ copiarTablaPropuesta(b4.dataset.gid); return; }
    const b5 = e.target.closest('.btn-agregar-clas'); if(b5){ agregarClasificadorAPropuesta(b5.id.replace('btnAgregarClas_','')); return; }
    const b6 = e.target.closest('.btn-quitar-fila-clas'); if(b6){
      const tr = b6.closest('tr'); const tb = tr.closest('tbody');
      quitarClasificadorDeLaPropuesta(tb.id.replace('filas_',''), tr);
      return;
    }
  });
  ra.addEventListener('input', e => {
    if(e.target.classList.contains('inp-anula') || e.target.classList.contains('inp-credito')){
      const crudo = e.target.value;
      if(/[.,]/.test(crudo)) mostrarAvisoTransitorio(e.target, 'A nivel presupuestal solo se permiten números enteros');
      if(crudo !== ''){ const n = parseFloat(crudo.replace(',','.')); if(!isNaN(n)){ const ent = Math.max(0, Math.trunc(n)); if(String(ent) !== crudo) e.target.value = ent; } }
      // Un mismo clasificador no puede recibir anulación y crédito a la vez: el que se
      // escribió de último manda, y el otro campo de esa fila se limpia solo.
      const valorActual = parseInt(e.target.value, 10) || 0;
      if(valorActual > 0){
        const tr = e.target.closest('tr');
        const opuesta = e.target.classList.contains('inp-anula') ? tr.querySelector('.inp-credito') : tr.querySelector('.inp-anula');
        if(opuesta && (parseInt(opuesta.value, 10) || 0) > 0) opuesta.value = '';
      }
      const tb = e.target.closest('tbody'); if(tb && tb.id.startsWith('filas_')) actualizarValidacionPropuesta(tb.id.replace('filas_',''));
    }
  });
  ra.addEventListener('blur', e => {
    if(e.target.classList.contains('inp-anula') || e.target.classList.contains('inp-credito')) ocultarTooltipDe(e.target);
  }, true);
}
document.addEventListener('DOMContentLoaded', init);
</script>

<script>
/* Impresión en una sola hoja: antes de imprimir se oculta el buscador y se reduce el tamaño
   lo justo para que el resultado entre en una A4 vertical; al terminar todo vuelve a la normalidad. */
(function(){
  const ANCHO = 733, ALTO = 1062 * 0.97;   // A4 vertical con márgenes de 8 mm, en px CSS (96 ppp)
  let activo = false;
  function preparar(){
    if(activo) return; activo = true;
    const html = document.documentElement, b = document.body;
    html.classList.add('preimp');
    let z = 1;
    for(let zz = 1; zz >= 0.4; zz -= 0.02){
      z = zz; b.style.zoom = 1; b.style.width = (ANCHO / zz) + 'px';
      if(b.scrollHeight * zz <= ALTO) break;
    }
    b.style.zoom = z;
  }
  function restaurar(){
    activo = false;
    document.documentElement.classList.remove('preimp');
    document.body.style.zoom = ''; document.body.style.width = '';
  }
  window.addEventListener('beforeprint', preparar);
  window.addEventListener('afterprint', restaurar);
  if(window.matchMedia){ const mq = window.matchMedia('print'); const f = e => e.matches ? preparar() : restaurar();
    mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f); }
})();
</script>
